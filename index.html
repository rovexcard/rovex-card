<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROVEX CARD - متجر البطاقات الرقمية</title>
    
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script type="text/javascript">
       (function(){
          emailjs.init("Nu45_d-5zAgxoEVAw");
       })();
    </script>

    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #3b82f6;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --success-color: #22c55e;
            --error-color: #ef4444;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            direction: rtl;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            padding: 40px 0;
            border-bottom: 1px solid #334155;
            margin-bottom: 40px;
        }

        header h1 {
            color: var(--accent-color);
            font-size: 2.5rem;
            margin: 0 0 10px 0;
        }

        .auth-container {
            max-width: 450px;
            margin: 0 auto 50px auto;
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            border: 1px solid #334155;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-muted);
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #334155;
            background-color: #0f172a;
            color: white;
            box-sizing: border-box;
            font-size: 1rem;
        }

        .btn {
            width: 100%;
            padding: 12px;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
        }

        .status-msg {
            margin-top: 15px;
            text-align: center;
            font-size: 0.9rem;
        }

        .status-msg.success { color: var(--success-color); }
        .status-msg.error { color: var(--error-color); }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>ROVEX CARD</h1>
        <p>متجر البطاقات الرقمية والشحن الفوري</p>
    </header>

    <div class="auth-container" id="authSection">
        <h2 style="text-align: center; color: var(--accent-color);">تسجيل الدخول / التوثيق</h2>
        
        <div id="stepSendOtp">
            <div class="form-group">
                <label for="userEmail">البريد الإلكتروني:</label>
                <input type="email" id="userEmail" placeholder="example@domain.com" required>
            </div>
            <button class="btn" onclick="sendOTP()">إرسال رمز التحقق OTP</button>
        </div>

        <div id="stepVerifyOtp" class="hidden">
            <div class="form-group">
                <label for="otpInput">أدخل رمز التحقق (OTP):</label>
                <input type="text" id="otpInput" maxlength="6" placeholder="123456" required>
            </div>
            <button class="btn" onclick="verifyOTP()">تأكيد الرمز</button>
        </div>

        <div id="statusMessage" class="status-msg"></div>
    </div>
</div>

<script>
    let generatedOTP = null;

    function showStatus(msg, isError = false) {
        const statusEl = document.getElementById('statusMessage');
        statusEl.innerText = msg;
        statusEl.className = isError ? 'status-msg error' : 'status-msg success';
    }

    function sendOTP() {
        const email = document.getElementById('userEmail').value;
        if (!email) {
            showStatus('يرجى إدخال البريد الإلكتروني أولاً!', true);
            return;
        }

        generatedOTP = Math.floor(100000 + Math.random() * 900000).toString();
        showStatus('جاري إرسال الرمز...');

        const templateParams = {
            "email": email,
            "to_email": email,
            "otp_code": generatedOTP,
            "name": "عميل ROVEX",
            "title": "رمز التحقق الخاصة بـ ROVEX"
        };

        emailjs.send('service_odka0lu', 'template_xsmjqd8', templateParams)
            .then(function() {
                showStatus('تم إرسال الرمز بنجاح! تفقد إيميلك الآن.');
                document.getElementById('stepSendOtp').classList.add('hidden');
                document.getElementById('stepVerifyOtp').classList.remove('hidden');
            }, function(error) {
                console.error(error);
                showStatus('حدث خطأ أثناء الإرسال. افحص قسم History في EmailJS.', true);
            });
    }

    function verifyOTP() {
        const userOtp = document.getElementById('otpInput').value;
        if (userOtp === generatedOTP) {
            showStatus('تم التحقق بنجاح!');
        } else {
            showStatus('رمز التحقق غير صحيح!', true);
        }
    }
</script>

</body>
</html>
