<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROVEX CARD | المتجر الرقمي المتكامل</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-main: #07090e;
            --bg-card: rgba(21, 25, 38, 0.7);
            --accent-gold: #f0b90b;
            --accent-cyan: #00f2fe;
            --accent-red: #ff3366;
            --accent-green: #00e676;
            --text-main: #ffffff;
            --text-muted: #8e9aaf;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; user-select: none; }
        body { background-color: var(--bg-main); color: var(--text-main); min-height: 100vh; overflow-x: hidden; }

        .navbar { background: rgba(11, 14, 23, 0.9); backdrop-filter: blur(16px); border-bottom: 1px solid rgba(255, 255, 255, 0.08); position: sticky; top: 0; z-index: 1000; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; }
        .brand-logo { font-size: 1.3rem; font-weight: 900; background: linear-gradient(135deg, #fff 0%, var(--accent-cyan) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; cursor: pointer; }
        .nav-actions { display: flex; gap: 8px; align-items: center; }

        .btn-act { padding: 6px 12px; border-radius: 12px; font-weight: 700; font-size: 0.8rem; cursor: pointer; border: none; }
        .btn-login { background: linear-gradient(135deg, var(--accent-cyan), #0072ff); color: #000; }
        .btn-register { background: rgba(255,255,255,0.1); color: #fff; border: 1px solid rgba(255,255,255,0.2); }

        .controls-container { padding: 15px; max-width: 1200px; margin: 0 auto; }
        .search-wrapper input { width: 100%; padding: 12px 15px; background: rgba(18, 22, 34, 0.8); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 16px; color: #fff; font-size: 0.9rem; outline: none; margin-bottom: 12px; }

        /* شبكة المنتجات: منتجان في كل سطر للهواتف */
        .products-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; max-width: 1200px; margin: 10px auto; padding: 0 12px; }
        @media (min-width: 768px) { .products-grid { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 18px; } }

        .product-card { background: var(--bg-card); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 16px; padding: 12px; display: flex; flex-direction: column; justify-content: space-between; position: relative; }
        .img-wrapper { width: 100%; height: 100px; background: rgba(0,0,0,0.3); border-radius: 10px; display: flex; align-items: center; justify-content: center; margin-bottom: 8px; }
        .img-wrapper img { max-width: 90%; max-height: 90%; object-fit: contain; }
        
        .p-title { font-size: 0.82rem; font-weight: 800; margin-bottom: 4px; }
        .p-price { font-size: 0.95rem; font-weight: 900; color: var(--accent-gold); margin-bottom: 8px; }
        .btn-buy { width: 100%; padding: 8px; background: linear-gradient(135deg, var(--accent-cyan), #0072ff); color: #000; border: none; border-radius: 10px; font-weight: 800; font-size: 0.8rem; cursor: pointer; }

        /* Modals */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); backdrop-filter: blur(8px); display: none; justify-content: center; align-items: center; z-index: 2000; padding: 15px; }
        .modal-box { background: #11141e; border: 1px solid rgba(255,255,255,0.15); border-radius: 20px; padding: 20px; width: 100%; max-width: 380px; position: relative; }
        .form-input { width: 100%; padding: 12px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.15); border-radius: 10px; color: #fff; margin-bottom: 10px; outline: none; }
        .alert-error { background: rgba(255, 51, 102, 0.2); border: 1px solid var(--accent-red); color: #ff6688; padding: 8px; border-radius: 8px; font-size: 0.75rem; margin-bottom: 10px; display: none; }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="brand-logo"><i class="fa-solid fa-bolt"></i> ROVEX CARD</div>
        <div class="nav-actions" id="nav-actions">
            <button class="btn-act btn-login" onclick="openModal('login-modal')">دخول</button>
            <button class="btn-act btn-register" onclick="openModal('register-modal')">حساب جديد</button>
        </div>
    </nav>

    <div class="controls-container">
        <div class="search-wrapper">
            <input type="text" id="searchInput" onkeyup="filterProducts()" placeholder="ابحث بين 1000+ منتج وبطاقة...">
        </div>
    </div>

    <main class="products-grid" id="productsContainer"></main>

    <!-- Modal: تسجيل الدخول -->
    <div class="modal-overlay" id="login-modal">
        <div class="modal-box">
            <h3>تسجيل الدخول</h3>
            <div class="alert-error" id="login-error"></div>
            <input type="text" id="login-email" class="form-input" placeholder="البريد الإلكتروني أو الهاتف">
            <input type="password" id="login-pass" class="form-input" placeholder="كلمة المرور">
            <button class="btn-buy" onclick="handleLogin()">تسجيل الدخول</button>
        </div>
    </div>

    <!-- Modal: إنشاء حساب -->
    <div class="modal-overlay" id="register-modal">
        <div class="modal-box">
            <h3>إنشاء حساب جديد</h3>
            <div class="alert-error" id="reg-error"></div>
            <input type="email" id="reg-email" class="form-input" placeholder="البريد الإلكتروني الحقيقي">
            <input type="password" id="reg-pass" class="form-input" placeholder="كلمة المرور">
            <input type="password" id="reg-pass-confirm" class="form-input" placeholder="تأكيد كلمة المرور">
            <button class="btn-buy" onclick="handleRegister()">إرسال كود التحقق (OTP)</button>
        </div>
    </div>

    <!-- Modal: التحقق عبر OTP -->
    <div class="modal-overlay" id="otp-modal">
        <div class="modal-box">
            <h3>تأكيد البريد الإلكتروني</h3>
            <p style="font-size:0.8rem; color:#aaa; margin-bottom:10px;">أدخل كود التحقق المرسل إلى إيميلك:</p>
            <input type="text" id="otp-input" class="form-input" placeholder="أدخل الكود المكون من 4-6 أرقام">
            <button class="btn-buy" onclick="verifyOTP()">تأكيد وفتح الحساب</button>
        </div>
    </div>

    <!-- Modal: تأكيد أمان الشراء (PIN Security) -->
    <div class="modal-overlay" id="purchase-sec-modal">
        <div class="modal-box">
            <h3>تأكيد عملية الشراء</h3>
            <p style="font-size:0.8rem; color:#aaa; margin-bottom:10px;">لأسباب أمنية وتأكيد الخصوصية، أدخل كود الحماية الخاص بحسابك لإتمام الشحن:</p>
            <input type="password" id="buy-pin" class="form-input" placeholder="أدخل كود الأمان">
            <button class="btn-buy" onclick="confirmPurchase()">تأكيد الشراء الفوري</button>
        </div>
    </div>

    <script>
        const API_URL = "http://localhost:3000/api"; // عنوان السيرفر الخلفي

        // توليد المنتجات وعروض ببجي الكاملة
        const baseProducts = [
            { id: 1, name: "شدات ببجي 60 UC", price: "0.99 $", img: "https://pngmania.com/wp-content/uploads/2023/02/pubg-mobile-logo.png" },
            { id: 2, name: "شدات ببجي 325 UC", price: "4.99 $", img: "https://pngmania.com/wp-content/uploads/2023/02/pubg-mobile-logo.png" },
            { id: 3, name: "شدات ببجي 660 UC", price: "9.50 $", img: "https://pngmania.com/wp-content/uploads/2023/02/pubg-mobile-logo.png" },
            { id: 4, name: "شدات ببجي 1800 UC", price: "24.00 $", img: "https://pngmania.com/wp-content/uploads/2023/02/pubg-mobile-logo.png" },
            { id: 5, name: "شدات ببجي 3850 UC", price: "48.00 $", img: "https://pngmania.com/wp-content/uploads/2023/02/pubg-mobile-logo.png" },
            { id: 6, name: "شدات ببجي 8100 UC", price: "95.00 $", img: "https://pngmania.com/wp-content/uploads/2023/02/pubg-mobile-logo.png" },
            { id: 7, name: "شدات ببجي 24000 UC", price: "270.00 $", img: "https://pngmania.com/wp-content/uploads/2023/02/pubg-mobile-logo.png" }
        ];

        // مصفوفة لتوليد 1000 منتج تلقائياً
        let allProducts = [...baseProducts];
        for(let i = 8; i <= 1000; i++) {
            allProducts.push({
                id: i,
                name: `بطاقة شحن إلكترونية #${i}`,
                price: `${(Math.random() * 50 + 5).toFixed(2)} $`,
                img: "https://upload.wikimedia.org/wikipedia/commons/d/d6/Visa_2021.svg"
            });
        }

        function renderProducts(list) {
            const container = document.getElementById('productsContainer');
            container.innerHTML = list.slice(0, 40).map(p => `
                <div class="product-card">
                    <div class="img-wrapper"><img src="${p.img}"></div>
                    <div class="p-title">${p.name}</div>
                    <div class="p-price">${p.price}</div>
                    <button class="btn-buy" onclick="triggerPurchase(${p.id})">شراء الآن</button>
                </div>
            `).join('');
        }

        renderProducts(allProducts);

        function openModal(id) { document.getElementById(id).style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }

        // الربط مع السيرفر للدخول
        async function handleLogin() {
            const email = document.getElementById('login-email').value;
            const pass = document.getElementById('login-pass').value;
            const errorDiv = document.getElementById('login-error');

            const res = await fetch(`${API_URL}/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, pass })
            });
            const data = await res.json();

            if(!res.ok) {
                errorDiv.style.display = 'block';
                errorDiv.innerText = data.message; // "الحساب غير موجود" أو "كلمة السر خاطئة"
            } else {
                alert('تم تسجيل الدخول بنجاح!');
                closeModal('login-modal');
            }
        }

        // إنشاء حساب وإرسال OTP حقيقي
        async function handleRegister() {
            const email = document.getElementById('reg-email').value;
            const pass = document.getElementById('reg-pass').value;
            const confirm = document.getElementById('reg-pass-confirm').value;
            const errorDiv = document.getElementById('reg-error');

            if(pass !== confirm) {
                errorDiv.style.display = 'block';
                errorDiv.innerText = "كلمات المرور غير متطابقة!";
                return;
            }

            const res = await fetch(`${API_URL}/register`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, pass })
            });

            if(res.ok) {
                closeModal('register-modal');
                openModal('otp-modal');
            }
        }

        function triggerPurchase(id) {
            openModal('purchase-sec-modal');
        }

        function confirmPurchase() {
            alert('تم تأكيد رمز الأمان وإرسال طلب الشحن بنجاح!');
            closeModal('purchase-sec-modal');
        }
    </script>
</body>
</html>
