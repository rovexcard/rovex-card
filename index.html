<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROVEX CARD - متجر البطاقات الرقمية</title>
    
    <!-- EmailJS SDK -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script type="text/javascript">
       (function(){
          emailjs.init("Nu45_d-5zAgxoEVAw");
       })();
    </script>

    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #3b82f6;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --success-color: #22c55e;
            --error-color: #ef4444;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            direction: rtl;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            padding: 40px 0;
            border-bottom: 1px solid #334155;
            margin-bottom: 40px;
        }

        header h1 {
            color: var(--accent-color);
            font-size: 2.5rem;
            margin: 0 0 10px 0;
            letter-spacing: 2px;
        }

        header p {
            color: var(--text-muted);
            margin: 0;
        }

        .auth-container {
            max-width: 450px;
            margin: 0 auto 50px auto;
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            border: 1px solid #334155;
        }

        .auth-container h2 {
            margin-top: 0;
            color: var(--accent-color);
            text-align: center;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-muted);
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #334155;
            background-color: #0f172a;
            color: white;
            box-sizing: border-box;
            font-size: 1rem;
        }

        .btn {
            width: 100%;
            padding: 12px;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }

        .btn:hover {
            background-color: #2563eb;
        }

        .status-msg {
            margin-top: 15px;
            text-align: center;
            font-size: 0.9rem;
        }

        .status-msg.success { color: var(--success-color); }
        .status-msg.error { color: var(--error-color); }

        .hidden { display: none; }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 40px;
        }

        .card-item {
            background-color: var(--card-bg);
            border-radius: 10px;
            padding: 20px;
            border: 1px solid #334155;
            text-align: center;
            transition: transform 0.2s;
        }

        .card-item:hover {
            transform: translateY(-5px);
        }

        .card-item h3 {
            margin-top: 0;
            color: var(--accent-color);
        }

        .card-price {
            font-size: 1.25rem;
            font-weight: bold;
            color: var(--success-color);
            margin: 15px 0;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>ROVEX CARD</h1>
        <p>متجر البطاقات الرقمية والشحن الفوري</p>
    </header>

    <!-- قسم التحقق وتأكيد البريد -->
    <div class="auth-container" id="authSection">
        <h2>تسجيل الدخول / التوثيق</h2>
        
        <!-- نموذج إرسال الرمز -->
        <div id="stepSendOtp">
            <div class="form-group">
                <label for="userEmail">البريد الإلكتروني:</label>
                <input type="email" id="userEmail" placeholder="example@domain.com" required>
            </div>
            <button class="btn" onclick="sendOTP()">إرسال رمز التحقق OTP</button>
        </div>

        <!-- نموذج إدخال الرمز -->
        <div id="stepVerifyOtp" class="hidden">
            <div class="form-group">
                <label for="otpInput">أدخل رمز التحقق (OTP) المكون من 6 أرقام:</label>
                <input type="text" id="otpInput" maxlength="6" placeholder="123456" required>
            </div>
            <button class="btn" onclick="verifyOTP()">تأكيد الرمز</button>
        </div>

        <div id="statusMessage" class="status-msg"></div>
    </div>

    <!-- متجر البطاقات الرقمية -->
    <div id="storeContent" class="hidden">
        <h2 style="text-align: center; color: var(--accent-color);">البطاقات المتاحة</h2>
        <div class="cards-grid">
            <div class="card-item">
                <h3>بطاقة Free Fire</h3>
                <p>100 + 10 جوهرة</p>
                <div class="card-price">1.00 $</div>
                <button class="btn" onclick="buyCard('Free Fire 110 Gems')">شراء الآن</button>
            </div>
            <div class="card-item">
                <h3>بطاقة PUBG Mobile</h3>
                <p>60 شدة UC</p>
                <div class="card-price">0.99 $</div>
                <button class="btn" onclick="buyCard('PUBG 60 UC')">شراء الآن</button>
            </div>
            <div class="card-item">
                <h3>بطاقة iTunes</h3>
                <p>رصيد $10 متجر أمريكي</p>
                <div class="card-price">10.00 $</div>
                <button class="btn" onclick="buyCard('iTunes $10')">شراء الآن</button>
            </div>
        </div>
    </div>
</div>

<script>
    let generatedOTP = null;

    function showStatus(msg, isError = false) {
        const statusEl = document.getElementById('statusMessage');
        statusEl.innerText = msg;
        statusEl.className = isError ? 'status-msg error' : 'status-msg success';
    }

    function sendOTP() {
        const email = document.getElementById('userEmail').value;
        if (!email) {
            showStatus('يرجى إدخال البريد الإلكتروني أولاً!', true);
            return;
        }

        // توليد رمز مكون من 6 أرقام
        generatedOTP = Math.floor(100000 + Math.random() * 900000).toString();

        showStatus('جاري إرسال الرمز إلى بريدك الإلكتروني...');

        // معلمات الرسالة لـ EmailJS
        const templateParams = {
            email: email,
            otp_code: generatedOTP
        };

        // تم تحديث معرف الخدمة هنا إلى service_odka0lu
        emailjs.send('service_odka0lu', 'template_xsmjqd8', templateParams)
            .then(function(response) {
                showStatus('تم إرسال رمز التحقق بنجاح! يرجى تفقد بريدك الإلكتروني.');
                document.getElementById('stepSendOtp').classList.add('hidden');
                document.getElementById('stepVerifyOtp').classList.remove('hidden');
            }, function(error) {
                console.error('فشل الإرسال:', error);
                showStatus('حدث خطأ أثناء إرسال الرمز. يرجى المحاولة لاحقاً.', true);
            });
    }

    function verifyOTP() {
        const userOtp = document.getElementById('otpInput').value;

        if (userOtp === generatedOTP) {
            showStatus('تم التحقق بنجاح! مرحباً بك في ROVEX CARD.');
            setTimeout(() => {
                document.getElementById('authSection').classList.add('hidden');
                document.getElementById('storeContent').classList.remove('hidden');
            }, 1500);
        } else {
            showStatus('رمز التحقق غير صحيح، يرجى المحاولة مرة أخرى.', true);
        }
    }

    function buyCard(cardName) {
        alert('شكراً لطلبك! تم اختيار: ' + cardName);
    }
</script>

</body>
</html>
